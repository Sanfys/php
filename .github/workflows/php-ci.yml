name: PHP CI Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          tools: composer

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Lint code with Pint
        run: ./vendor/bin/pint --test

      - name: Run unit tests
        run: ./vendor/bin/phpunit tests/Unit

      - name: Demonstrate GitHub Secrets
        env:
          MY_SUPER_SECRET_KEY: ${{ secrets.MY_SUPER_SECRET_KEY }}
        run: echo "Значення секрету (має бути замасковане) $MY_SUPER_SECRET_KEY"
